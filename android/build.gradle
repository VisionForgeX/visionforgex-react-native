buildscript {
    ext.kotlin_version = "1.9.24"
    repositories { google(); mavenCentral() }
    dependencies {
        classpath("com.android.tools.build:gradle:8.5.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.visionforgex.rn"
    compileSdk = 34
    defaultConfig { minSdk = 24 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

repositories {
    google()
    mavenCentral()
    maven { url = uri("https://jitpack.io") }   // where the VisionForgeX Android SDK is built
}

dependencies {
    implementation("com.facebook.react:react-android")   // the version of the app's React Native
    api("com.github.VisionForgeX.visionforgex-android-sdk:vfx-ads:1.0.2")
}
