buildscript {
    ext.kotlin_version = "1.9.24"
    repositories { google(); mavenCentral() }
    dependencies {
        classpath("com.android.tools.build:gradle:8.5.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.visionforgex.rn"
    compileSdk = 35   // Google's Next-Gen SDK needs 35
    defaultConfig { minSdk = 24 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        // The native SDK and Google's ads library are built with a newer Kotlin than many React Native versions
        // bring (RN 0.74 compiles with Kotlin 1.9): this lets this module read their metadata.
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}

repositories {
    google()
    mavenCentral()
    maven { url = uri("https://jitpack.io") }   // where the VisionForgeX Android SDK is built
}

dependencies {
    implementation("com.facebook.react:react-android")   // the version of the app's React Native
    // Which of Google's Android SDKs the app runs on: "nextgen" (Google's GMA Next-Gen SDK, the default) or "gma" (Google
    // Mobile Ads 25.x, retired by Google on 30 Jun 2028): visionforgexEngine=gma in the app's android/gradle.properties.
    // VFX_SDK_VERSION (a tag or a commit, which JitPack builds) is only for this repository's CI.
    api("com.github.VisionForgeX.visionforgex-android-sdk:${(rootProject.findProperty("visionforgexEngine") ?: "nextgen").toString() == "gma" ? "vfx-ads" : "vfx-ads-nextgen"}:${(System.getenv("VFX_SDK_VERSION") ?: "1.2.0")}")
}
